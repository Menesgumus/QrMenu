# Bu yapılandırma yalnızca menu.prilmones.com.tr alan adı içindir.
# Sunucudaki mevcut Pril Masası site dosyalarına ve yapılandırmalarına dokunulmamalıdır.
# Kurulum öncesi <APP_PORT> yerine sunucuda doğruladığınız boş localhost portunu yazın.
# Ardından Certbot (`sudo certbot --nginx -d menu.prilmones.com.tr`) HTTPS/443 bloğunu ve
# HTTP -> HTTPS yönlendirmesini bu dosyaya otomatik ekleyecektir.

server {
    listen 80;
    listen [::]:80;
    server_name menu.prilmones.com.tr;

    location / {
        proxy_pass http://127.0.0.1:<APP_PORT>;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        proxy_read_timeout 60s;
        proxy_send_timeout 60s;
    }
}
